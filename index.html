<script>
const D=`Формула площі і діагоналі квадрата|S = a², S = {d²/2}; діагональ d = a√2
На чому лежить центр вписаного і описаного кола навколо Δ?|Вписаного — перетин бісектрис. Описаного — перетин серединних перпендикулярів.
Косинус — це відношення?|Прилеглого катета до гіпотенузи
Центром кола, описаного навколо прямокутного Δ є?|Середина гіпотенузи
Площа повної поверхні конуса, циліндра, куба?|Куб: S = 6a². Конус: S = Sб + Sо = πR(R + l). Циліндр: S = 2Sо + Sб = 2πR(R + h).
Що таке складене число?|Число, яке має більше двох дільників (не лише 1 і саме себе).
В яких випадках треба знаходити ОДЗ?|Корінь, log, дріб
Коли графік функції симетричний відносно осі Oy?|Коли f(−x) = f(x) — функція парна.
Сума протилежних кутів вписаного чотирикутника?|Дорівнює 180°
Навести приклад функції, яка рухається вправо на 7.|y = (x − 7)² (загалом y = f(x − 7))
Коли застосовується розміщення A?|Беруть не всі елементи, порядок важливий.
Що це таке і що можна знайти? (x−a)² + (y−b)² = R²|Рівняння кола: центр (a; b), R — радіус.
Що означають екстремуми функцій?|Це максимуми й мінімуми: y_min, y_max.
Що таке розмах, мода, медіана?|Розмах — різниця найбільшого й найменшого. Мода — найчастіше число. Медіана — серединне значення (для парної кількості — середнє двох центральних).
Властивість медіани в Δ?|Медіани діляться в точці перетину у відношенні 2 : 1 від вершини і ділять Δ на рівновеликі (S = S).
Як виглядає логарифмічна функція і її властивості?|y = logₐx, x > 0, графік через (1; 0). a > 1 — зростає, 0 < a < 1 — спадає. Область значень — усі дійсні числа.

 <div style="display:flex;gap:8px;margin-top:11px"><button class="pill sm" style="font-size:.9rem;padding:8px 14px" onclick="gs=new Set([6,7,8,9,10,11]);setup()">✓ Усі класи</button><button class="pill sm" style="font-size:.9rem;padding:8px 14px" onclick="gs=new Set([11]);setup()">Тільки 11</button></div></div>
 <div class="sp"></div><button class="cta" onclick="go('${m}')">${cta}</button></div>`}
function go(m){mode=m;let p=sh(pool(m));if(mode!='blitz'&&cnt)p=p.slice(0,cnt);init(p)}
function init(d){deck=d;total=d.length;pos=0;busy=0;xp=0;st=0;best=0;first=0;att=0;lives=3;tl=TT;over=0;clearInterval(tm);
 if(mode=='blitz')tm=setInterval(()=>{tl--;const a=document.getElementById('tl'),b=document.getElementById('tb');if(a)a.textContent=tl;if(b)b.style.width=tl/TT*100+'%';if(tl<=0)fin()},1000);draw()}
function draw(){if(over)return;mode=='cards'?drawC():drawQ()}
function hdr(pw,tmr,mid){return `<div class="hd"><button class="pill" onclick="home()">✕</button><div class="pb ${tmr?'tm':''}"><i id="tb" style="width:${pw}%"></i></div><span class="pill ${st>0?'pop':''}">${mid}</span></div>`}
function drawC(){
 if(pos>=deck.length)return fin();
 scr('cards');const c=deck[pos],h=(c.i*47)%360;
 $.innerHTML=`<div class="scr">${hdr(Math.min(100,first/total*100),0,`🔥 ${st} · ✨ ${xp}`)}
 <div class="stage" style="--a:${PAL[c.i%6][0]};--b:${PAL[c.i%6][1]}"><div class="bk b2"></div><div class="bk b1"></div>
 <div class="c" id="c" onclick="this.style.transform='';this.classList.toggle('f')"><div class="s ff"><span class="n">№ ${c.i+1}</span><div><div class="q" style="font-size:${fz(c.q,'clamp(1.6rem,6vw,2.4rem)','clamp(1.35rem,5vw,1.9rem)','1.15rem')}">${fm(c.q)}</div></div><div class="h">торкнись, щоб побачити відповідь</div></div><div class="s bc"><span class="n">Відповідь</span><div><div class="a" style="font-size:${fz(c.a,'clamp(1.5rem,5.5vw,2.1rem)','clamp(1.25rem,4.4vw,1.65rem)','1.08rem')}">${fm(c.a)}</div></div></div></div></div>
 <div class="row"><button class="bt no" onclick="mv(0)">😵 Ще повчу</button><button class="bt ok" onclick="mv(1)">✅ Знаю!</button></div></div>`;
 const e=document.getElementById('c');let x0;
 e.ontouchstart=t=>x0=t.touches[0].clientX;
 e.ontouchend=t=>{const d=t.changedTouches[0].clientX-x0;if(Math.abs(d)>70){e.onclick=null;mv(d>0?1:0)}};
 e.onmousemove=ev=>{if(e.classList.contains('f'))return;const r=e.getBoundingClientRect();e.style.transform=`rotateY(${((ev.clientX-r.left)/r.width-.5)*10}deg) rotateX(${-((ev.clientY-r.top)/r.height-.5)*10}deg)`};
 e.onmouseleave=()=>e.style.transform='';
}
function mv(k){if(busy)return;busy=1;const e=document.getElementById('c'),c=deck[pos];rec(c,k);e.style.transform='';e.classList.remove('f');e.classList.add(k?'r':'l');
 if(k){st++;best=Math.max(best,st);xp+=10+Math.min(st,8)*3;if(!c.r)first++;M[c.i]=2;boom()}else{st=0;c.r=1;M[c.i]=1;deck.push(c)}
 setTimeout(()=>{pos++;busy=0;draw()},330)}
function drawQ(){
 if(pos>=deck.length){if(mode=='blitz'){deck=sh(deck);pos=0}else return fin()}
 scr('quiz');const c=deck[pos];const w=sh(QZ[c.i].slice(1)).map(t=>({a:t,i:-1}));if(!bag.length)bag=sh([0,1,2,3]);w.splice(bag.pop(),0,{a:QZ[c.i][0],i:c.i});const o=w;cur=o;const bl=mode=='blitz';
 $.innerHTML=`<div class="scr">${hdr(bl?tl/TT*100:pos/total*100,bl,(bl?'⏱ <b id="tl">'+tl+'</b> · ':(lives>0?'❤️'.repeat(lives):'💀')+' · ')+`🔥 ${st} · ✨ ${xp}`)}
 <div class="gl qq"><div class="q" style="font-size:${fz(c.q,'clamp(1.3rem,5vw,1.9rem)','clamp(1.15rem,4.2vw,1.5rem)','1.02rem')}">${fm(c.q)}</div></div>
 <div class="opts">${o.map((x,k)=>`<button class="opt" style="animation-delay:${.08+k*.07}s" onclick="ans(${k})"><b>${'ABCD'[k]}</b><span>${fm(x.a)}</span></button>`).join('')}</div></div>`}
function ans(k){if(busy)return;busy=1;att++;const c=deck[pos],ok=cur[k].i==c.i,bs=document.querySelectorAll('.opt');rec(c,ok);
 bs.forEach((b,j)=>{if(cur[j].i==c.i)b.classList.add('okk')});
 if(ok){st++;best=Math.max(best,st);xp+=10+Math.min(st,8)*3;first++;M[c.i]=2;boom()}
 else{bs[k].classList.add('bad');st=0;M[c.i]=M[c.i]==2?2:1;try{navigator.vibrate(120)}catch(e){}if(mode=='quiz')lives--}
 setTimeout(()=>{busy=0;if(over)return;if(mode=='quiz'&&lives<=0)return fin();pos++;draw()},ok?800:1900)}
function boom(){for(let i=0;i<12;i++){const s=document.createElement('span');s.className='cf';s.textContent=Array.from("⭐✨🎉💜🔥")[i%5];s.style.cssText=`left:50%;top:45%;--x:${(Math.random()-.5)*340}px;--y:${(Math.random()-.8)*300}px`;document.body.append(s);setTimeout(()=>s.remove(),950)}}
function fin(){if(over)return;scr('fin');over=1;clearInterval(tm);TX+=xp;
 const n=mode=='cards'?total:att,p=n?Math.round(first/n*100):0,bd=[];if(n)L.push({d:Date.now(),m:mode,ok:first,n,xp});L=L.slice(-60);sv();
 if(best>=5)bd.push('🔥 Серія 5+');if(n>=8&&first==n)bd.push('💎 Без помилок');if(xp>=200)bd.push('🚀 200+ XP');if(mode=='blitz'&&first>=10)bd.push('⚡ 10 за хвилину');if(!bd.length)bd.push('🌱 Початок шляху');
 $.innerHTML=`<div class="scr"><div class="mid"><div class="e">${p>=80?'🏆':p>=50?'🚀':'💪'}</div><h1 class="hero"><span class="g">${mode=='quiz'&&lives<=0?'Життя закінчились':mode=='blitz'?'Час вийшов':'Пройдено'}</span></h1>
 <div class="st"><div class="gl">${first}/${n}<small>правильно</small></div><div class="gl">${xp}<small>XP</small></div><div class="gl">${best}<small>серія 🔥</small></div></div><div>${bd.map(b=>`<span class="bd">${b}</span>`).join('')}</div><div class="sub" style="margin:0">Вивчено ${D.filter(c=>M[c.i]==2).length} з ${D.length} · точність за весь час ${acc()}%</div></div>
 <button class="cta" onclick="go('${mode}')">🔁 Ще раз</button><button class="pill" style="padding:15px" onclick="home()">🏠 Меню</button></div>`;
 for(let i=0;i<3;i++)setTimeout(boom,i*250)}
const acc=()=>{let a=0,b=0;for(const k in H){a+=H[k][0];b+=H[k][1]}return a+b?Math.round(a/(a+b)*100):0};
function rec(c,ok){const h=H[c.i]||(H[c.i]=[0,0]);h[ok?0:1]++;const t=new Date().toLocaleDateString('sv');DY[t]=(DY[t]||0)+1;sv()}
function stt(){return GL.map(([g,l])=>{const cs=D.filter(c=>c.g==g);let a=0,b=0;cs.forEach(c=>{const h=H[c.i];if(h){a+=h[0];b+=h[1]}});return{l,k:cs.filter(c=>M[c.i]==2).length,n:cs.length,ac:a+b?Math.round(a/(a+b)*100):null}})}
function prog(){scr('prog');const k=D.filter(c=>M[c.i]==2).length,ic={cards:'🃏',quiz:'🧠',blitz:'⚡'},dt=t=>new Date(t).toLocaleDateString('uk-UA',{day:'numeric',month:'short'});
 $.innerHTML=`<div class="scr"><div class="hd"><button class="pill" onclick="home()">← Назад</button><button class="pill" onclick="rep(this)">📋 Звіт</button></div>
 <input class="nm" placeholder="Ім’я учня" value="${NM.replace(/"/g,'&quot;')}" onchange="NM=this.value;sv()">
 <div class="st"><div class="gl">${k}/${D.length}<small>вивчено</small></div><div class="gl">${acc()}%<small>точність</small></div><div class="gl">${L.length}<small>раундів</small></div></div>
 <div class="gl sec"><p class="lb">За класами</p>${stt().map(x=>`<div class="gr"><b>${x.l} кл.</b><div class="pb"><i style="width:${x.k/x.n*100}%"></i></div><span>${x.k}/${x.n}${x.ac!=null?' · '+x.ac+'%':''}</span></div>`).join('')}</div>
 <div class="gl sec lst"><p class="lb">Останні раунди</p>${L.length?L.slice().reverse().map(r=>`<div class="rr"><span>${ic[r.m]} ${dt(r.d)}</span><b>${r.ok}/${r.n}</b><span>${r.n?Math.round(r.ok/r.n*100):0}%</span></div>`).join(''):'<p class="sub" style="margin:0">Поки немає раундів</p>'}</div></div>`}
function rep(b){const NL=String.fromCharCode(10),k=D.filter(c=>M[c.i]==2).length,t=['Звіт: '+(NM||'учень'),'Вивчено '+k+' з '+D.length+', точність '+acc()+'%, раундів '+L.length,...stt().map(x=>x.l+' клас: '+x.k+'/'+x.n+(x.ac!=null?' ('+x.ac+'%)':''))].join(NL);let ok=0;const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{ok=document.execCommand('copy')}catch(e){}a.remove();try{navigator.clipboard.writeText(t).catch(()=>{});ok=1}catch(e){}b.textContent=ok?'✓ Скопійовано':'Не вдалося';setTimeout(()=>{b.textContent='📋 Звіт'},1800)}
const ds=()=>{let n=0,d=new Date();if(!DY[d.toLocaleDateString('sv')])d.setDate(d.getDate()-1);while(DY[d.toLocaleDateString('sv')]){n++;d.setDate(d.getDate()-1)}return n};
function scr(n){const s=$.dataset.scr==n;$.dataset.scr=n;$.dataset.still=s?1:0}
function cu(){const e=document.getElementById('xpn');if(!e)return;const T=+e.textContent,t0=performance.now();(function f(t){const p=Math.min(1,Math.max(0,(t-t0)/800));e.textContent=Math.round(T*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
(()=>{let r=0,e;const R=document.documentElement;addEventListener('pointermove',ev=>{if(ev.pointerType=='touch')return;e=ev;const t=ev.target.closest&&ev.target.closest('.tile');if(t){const b=t.getBoundingClientRect();t.style.setProperty('--tx',ev.clientX-b.left+'px');t.style.setProperty('--ty',ev.clientY-b.top+'px')}
if(!r)r=requestAnimationFrame(()=>{r=0;R.style.setProperty('--mx',e.clientX+'px');R.style.setProperty('--my',e.clientY+'px');R.style.setProperty('--px',(e.clientX/innerWidth-.5)*2);R.style.setProperty('--py',(e.clientY/innerHeight-.5)*2);document.body.classList.add('pt')})})})();
home();
</script></body></html>
